<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/static/js/jquery.min.js"></script>
  <script type="text/javascript" src="/static/js/jquery.accordion.js"></script>
  <!-- <link rel="stylesheet" href="/static/css/jquery.accordion.css"> -->
  <title>Trace</title>
  <style>
/*
 * jQuery Accordion 0.0.1
 * (c) 2014 Victor Fernandez <victor@vctrfrnndz.com>
 * MIT Licensed.
/* Requirements */

/* [data-accordion] [data-content] {
    overflow: hidden;
    max-height: 0;
} */

/* Basic Theme */

/* [data-accordion] {
    line-height: 1;
} */

[data-control],
[data-content] > * {
    padding: 10px;
}

[data-content] [data-accordion] {
    border: 0;
    padding: 0;
}

[data-accordion] [data-control] {
    position: relative;
    padding-right: 40px;
}

[data-accordion] > [data-control]:after {
    content: "";
    position: absolute;
    right: 10px;
    top: 12px;
    font-size: 25px;
    font-weight: 200;
    color: #444; 
    height: 15px;
    width: 24px;
    background: url('/static/img/down.png') center center no-repeat;
    background-size: 50%;
}

[data-control]{
  background-color:white;
  border:0;
}

[data-accordion].open > [data-control]:after {
    -webkit-transform: rotate(-180deg); 
    -ms-transform: rotate(-180deg); 
    transform: rotate(-180deg); 
}

[level_1]{
  color:red;
}
  </style>
</head>

<body>
  <section id="demo" data-accordion-group>
    <section data-accordion>
      <button data-control level_1>Accordion 1</button>
      <div data-content>
        <article level_1>Item</article>
        <article level_1>Item</article>
        <article data-accordion>
          <button data-control>2nd Level</button>
          <div data-content>
            <article>Item</article>
            <article>Item</article>
            <article data-accordion>
              <button data-control>3rd Level</button>
              <div data-content>
                <article>Item</article>
                <article>Item</article>
                <article>Item</article>
              </div>
            </article>
          </div>
        </article>
        <article>Item</article>
        <article>Item</article>
        <article>Item</article>
      </div>
    </section>
  </section>
</body>
<script>
  $(document).ready(function () {
    $('#demo [data-accordion]').accordion();
  });
</script>

</html>
