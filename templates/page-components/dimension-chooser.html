<div class="w3-dropdown-hover w3-bar-item">
    <div class="w3-xlarge w3-margin-right w3-margin-left">

        {{ if eq .DisplayDimension "Size"}}
            <img src="/static/img/gauge-blue.png" alt="use value" style="width:24px;height:24px;color: blue;" />
        {{ end }}

        {{ if eq .DisplayDimension "Value"}}
        <img src="/static/img/clock-red.png" alt="value" style="width:24px;height:24px;color: red;" />
        {{ end }}

        {{ if eq .DisplayDimension "Price"}}
        <img src="/static/img/cash-yellow.png" alt="value" style="width:24px;height:24px;color: rgb(255, 174, 0);" />
        {{ end }}


    </div>
    <div class="w3-dropdown-content w3-bar-block w3-card-4">
        <a class=" w3-button  w3-bar-item" href="/user/display-size">
            <img src="/static/img/gauge-blue.png" alt="dashboards" style="width:24px;height:24px;color: blue;" />
        </a>
        <a class=" w3-button  w3-bar-item" href="/user/display-value">
            <img src="/static/img/clock-red.png" alt="value" style="width:24px;height:24px;color: red;" />
        </a>
        <a class=" w3-button  w3-bar-item" href="/user/display-price">
            <img src="/static/img/cash-yellow.png" alt="value" style="width:24px;height:24px;color: rgb(255, 174, 0);" />
        </a>
    </div>
</div>
