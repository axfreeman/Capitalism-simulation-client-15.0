<!--index.html-->
{{ template "header.html" .}}

  <!-- Beefup Scripts: see https://github.com/Schascha/BeefUp -->
  <link rel="stylesheet" href="/static/css/jquery.beefup.css">
  <script src="/static/js/jquery.min.js"> </script>
  <script src="/static/js/jquery.beefup.min.js"> </script>

<div class="w3-top w3-center">
  <div class="w3-bar">
    <a class="w3-button" id="less"><i class="fas fa-arrow-left"></i> </a>
    Trace
    <a class="w3-button" id="more"><i class="fas fa-arrow-right"></i></a>
  </div>
</div>

<div class="w3-section w3-card-4" style="width:90%; margin:auto">
  <header class="w3-container w3-blue">
    <h3 class="w3-center">{{ .Title}} </h3>
  </header>
  <article class="beefup">
    <!--Loop over the trace record-->
    {{range .Trace }}
    {{ . }}
    {{ end }}
  
  </article></div></article>
</div>
{{ template "footer.html" .}}

<script>
  $(function () {
    $('.beefup').beefup();
  });
</script>
